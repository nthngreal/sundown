name: Build release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0 (empty: build only)"
        required: false

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install PySide6-Essentials pyinstaller
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract >/dev/null
          echo "$PWD/squashfs-root/usr/bin" >> "$GITHUB_PATH"

      - name: Test
        run: python -m unittest discover tests

      - name: Build
        run: bash packaging/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Sundown-x86_64.AppImage
          path: dist/Sundown-x86_64.AppImage

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: Sundown ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/Sundown-x86_64.AppImage

  windows:
    needs: appimage          # one job at a time touches the GitHub release
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.0.0-dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install PySide6-Essentials pyinstaller psutil
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Test
        run: python -m unittest discover tests

      - name: Build app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name sundown `
            --icon packaging/sundown.ico `
            --add-data "sundown/assets;sundown/assets" `
            sundown.py

      - name: Build installer
        shell: pwsh
        run: |
          $v = $env:VERSION.TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DSourceDir=..\dist\sundown" packaging\sundown.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "dist\Sundown-Setup-$v.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  Sundown-Setup-$v.exe" | Out-File -Encoding ascii "$setup.sha256"
          "SETUP=$setup" >> $env:GITHUB_ENV

      - name: Verify installer (install, run, uninstall, reinstall, forced failure)
        shell: pwsh
        run: pwsh packaging/verify-windows.ps1 -Setup $env:SETUP

      - uses: actions/upload-artifact@v4
        with:
          name: Sundown-Setup-windows
          path: |
            ${{ env.SETUP }}
            ${{ env.SETUP }}.sha256

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: Sundown ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ env.SETUP }}
            ${{ env.SETUP }}.sha256

      - name: Check the published file is the verified one
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = Split-Path $env:SETUP -Leaf
          gh release download $env:VERSION --pattern $name --dir published --repo ${{ github.repository }}
          $a = (Get-FileHash $env:SETUP -Algorithm SHA256).Hash
          $b = (Get-FileHash "published\$name" -Algorithm SHA256).Hash
          Write-Host "built $a"; Write-Host "published $b"
          if ($a -ne $b) { exit 1 }
